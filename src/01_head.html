<style>
:root{
  --bg:#0a0a0a; --panel:#111214; --panel2:#16171b; --line:#26282c; --line2:#34373d;
  --tx:#e8e6e1; --mut:#8a8f98; --dim:#5a5f68;
  --acc:#c8a35f; --good:#9ec49a; --bad:#c98c8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;
  --min:'Hiragino Mincho ProN','Yu Mincho',YuMincho,'Noto Serif JP',serif;
  --bnav:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--bnav) + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ============ top bar ============ */
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--min);font-weight:700;font-size:15px;letter-spacing:.12em;white-space:nowrap;flex:0 0 auto}
.brand small{font-family:var(--mono);font-weight:400;color:var(--dim);font-size:8.5px;letter-spacing:.2em;margin-left:6px}
.viewtabs{display:none}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:42px;padding:0 34px;background:var(--panel);border:1px solid var(--line2);
  border-radius:9px;font-size:14px}
.search input::placeholder{color:var(--dim)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);
  width:30px;height:30px;border-radius:50%;cursor:pointer;display:none;font-size:18px;line-height:1}
.search.has .clr{display:block}
.fbtn.wide{flex:0 0 auto}
#glossBtn{margin-left:auto;flex:0 0 auto}
.fbtn{flex:0 0 auto;height:42px;padding:0 14px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);
  color:var(--mut);font-size:12.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
.fbtn.on{border-color:var(--acc);color:var(--acc)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;max-height:min(60vh,400px);overflow-y:auto;display:none;z-index:70;
  box-shadow:0 16px 44px rgba(0,0,0,.7);-webkit-overflow-scrolling:touch}
.sug.open{display:block}
.sug li{list-style:none;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;gap:9px;align-items:center}
.sug li:last-child{border-bottom:0}
.sug li.hl,.sug li:hover{background:var(--panel2)}
.sug .nm{font-size:13.5px;line-height:1.4;flex:1;min-width:0}
.sug .nm em{font-style:normal;color:var(--acc)}
.sug .mt{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .ok,.sug .no{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;flex:0 0 auto}
.sug .ok{border:1px solid var(--acc);color:var(--acc)}
.sug .no{border:1px solid var(--line2);color:var(--dim)}
.sug .head{padding:8px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);
  border-bottom:1px solid var(--line);background:var(--panel2)}
.selects{display:none;grid-template-columns:1fr 1fr;gap:7px;padding:0 12px 10px}
.selects.open{display:grid}
.sel{position:relative}
.sel label{position:absolute;top:5px;left:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  color:var(--dim);pointer-events:none}
.sel select{width:100%;height:50px;padding:17px 26px 3px 9px;background:var(--panel);border:1px solid var(--line2);
  border-radius:8px;font-size:13px;appearance:none;-webkit-appearance:none;cursor:pointer;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel::after{content:'▾';position:absolute;right:10px;top:58%;transform:translateY(-50%);color:var(--mut);
  pointer-events:none;font-size:11px}
.sel.on select{border-color:var(--acc);color:var(--acc)}
.hits{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 13px 8px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.hits b{color:var(--acc);font-weight:500}
.hits .rst{border:0;background:transparent;color:var(--mut);font-size:10.5px;text-decoration:underline;
  cursor:pointer;padding:3px;white-space:nowrap;flex:0 0 auto}

/* ============ views ============ */
main{max-width:1220px;margin:0 auto;padding:0 12px}
.view{display:none;padding:18px 0 30px}
.view.on{display:block}
.vtitle{margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--acc);margin-bottom:7px}
h1.big{font-family:var(--min);font-weight:700;font-size:26px;letter-spacing:.05em;line-height:1.3}
h1.big .en{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.26em;
  color:var(--dim);margin-top:6px}
.lead{color:var(--mut);font-size:12.8px;line-height:1.75;margin-top:11px;max-width:760px}
.lead b{color:var(--tx);font-weight:500}

/* hero (概況のみ) */
.hero{padding:6px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.hero .kanji{font-family:var(--min);font-weight:700;font-size:clamp(46px,15vw,84px);letter-spacing:.1em;line-height:1}
.hero .sub{font-family:var(--mono);letter-spacing:.28em;color:var(--acc);font-size:10px;margin-top:10px}
.hero .desc{color:var(--mut);font-size:12.5px;margin-top:12px;max-width:640px}
.specwrap{margin-top:18px}
#spectrum{width:100%;height:230px;display:block}
.specwrap{position:relative}
.speccap{display:flex;justify-content:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:6px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--panel);padding:13px 12px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:500;line-height:1.2}
.kpi .v small{font-size:11px;color:var(--mut);margin-left:2px}
.kpi .k{font-size:10px;overflow-wrap:anywhere;color:var(--mut);margin-top:5px;line-height:1.5}

.card{background:var(--panel);border:1px solid var(--line);padding:15px 13px 13px;margin-top:14px;min-width:0}
.card h3{font-size:13px;font-weight:700;line-height:1.5}
.card h3 .tag{font-family:var(--mono);font-weight:400;font-size:9px;color:var(--acc);letter-spacing:.16em;
  display:block;margin-bottom:5px}
.note{font-size:11.2px;color:var(--mut);margin-top:10px;line-height:1.7}
.note b{color:var(--tx);font-weight:500}
.cw{position:relative;height:250px;margin-top:10px}
.cw>canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.cw.tall{height:290px}
.cw.radar{height:275px}
canvas{touch-action:manipulation;display:block}

.seglab{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);margin-top:11px}
.seg{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding-bottom:3px;min-height:38px;align-items:flex-start}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:32px;padding:5px 11px;border:1px solid var(--line2);background:transparent;
  color:var(--mut);font-family:var(--mono);font-size:11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{border-color:var(--acc);color:var(--acc);background:rgba(200,163,95,.1)}
/* サブタブ（分析ビュー内） */
.subtabs{display:flex;gap:6px;margin-bottom:4px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 1 auto;min-height:38px;padding:6px 10px;border:1px solid var(--line2);background:transparent;
  color:var(--mut);font-size:13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.subtabs button.on{border-color:var(--acc);color:var(--acc);background:rgba(200,163,95,.1)}
.pane{display:none}.pane.on{display:block}

/* ---- valuation ---- */
.vhead{border-bottom:1px solid var(--line);padding-bottom:13px}
.vname{font-family:var(--min);font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.vmeta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.vscore{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.vscore .n{font-family:var(--mono);font-size:38px;line-height:1;font-weight:500}
.vscore .n small{font-size:12px;color:var(--mut)}
.vscore .g{font-family:var(--mono);font-size:11px;color:var(--acc);line-height:1.5}
.kpitab{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;table-layout:fixed}
.kpitab col.c1{width:32%}.kpitab col.c2{width:22%}.kpitab col.c3{width:20%}.kpitab col.c4{width:26%}
.kpitab th{font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.08em;color:var(--dim);
  text-align:left;padding:6px 4px;border-bottom:1px solid var(--line2)}
.kpitab td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.kpitab td:first-child{color:var(--tx);font-size:12px}
.kpitab .sm{color:var(--dim);font-size:9px;font-family:var(--mono);display:block;margin-top:2px;line-height:1.4}
.kpitab td{overflow-wrap:anywhere}
.kpitab .v{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--tx);font-size:12px}
.kpitab .md{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--dim);font-size:10.5px}
.pbar{display:flex;align-items:center;gap:6px}
.pbar .t{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:34px}
.pbar .f{height:100%;border-radius:3px}
.pbar .p{font-family:var(--mono);font-size:10.5px;width:22px;text-align:right;flex:0 0 auto}
.verdict{margin-top:16px;padding:14px 13px;background:var(--panel2);border-left:2px solid var(--acc)}
.verdict .t{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--acc);margin-bottom:8px}
.verdict p{font-size:12.5px;color:var(--mut);line-height:1.9}
.verdict p+p{margin-top:10px}
.verdict b{color:var(--tx);font-weight:500}
.vempty{padding:24px 4px;color:var(--dim);font-size:12.5px;line-height:1.85}
.vempty b{display:block;color:var(--mut);font-size:14px;margin-bottom:8px}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.qk button{min-height:36px;padding:6px 12px;border:1px solid var(--line2);background:transparent;color:var(--mut);
  border-radius:999px;font-size:12px;cursor:pointer}
.qk button:hover{border-color:var(--acc);color:var(--acc)}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:68px 1fr 42px;gap:7px;align-items:center;font-size:11px;color:var(--mut)}
.bar .t{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar .f{height:100%;border-radius:3px}
.bar .p{font-family:var(--mono);text-align:right;font-size:10.5px}

/* ---- help ---- */
.hlp{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;min-width:17px;
  border:1px solid var(--line2);border-radius:50%;background:transparent;color:var(--mut);
  font-family:var(--mono);font-size:10px;line-height:1;cursor:pointer;vertical-align:1px;margin-left:5px;padding:0}
.hlp:hover,.hlp:focus-visible{border-color:var(--acc);color:var(--acc)}
.hlp.big{width:20px;height:20px;min-width:20px;font-size:11px}
.hsheet{position:fixed;inset:0;z-index:100;display:none}
.hsheet.open{display:block}
.hsheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.hsheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--panel);
  border-top:1px solid var(--line2);border-radius:16px 16px 0 0;
  padding:6px 18px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.hsheet .grip{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 14px}
.hsheet .cat{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--acc)}
.hsheet h4{font-size:17px;font-weight:700;line-height:1.4;margin:6px 0 12px}
.hsheet p{font-size:13px;color:var(--mut);line-height:1.9}
.hsheet p+p{margin-top:10px}
.hsheet b{color:var(--tx);font-weight:500}
.hsheet .fx{margin:12px 0;padding:11px 12px;background:var(--panel2);border-left:2px solid var(--acc);
  font-family:var(--mono);font-size:12px;color:var(--tx);line-height:1.8;overflow-wrap:anywhere}
.hsheet .cav{margin-top:12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:8px;
  font-size:11.5px;color:var(--dim);line-height:1.8}
.hsheet .close{position:absolute;right:12px;top:10px;width:36px;height:36px;border:0;border-radius:50%;
  background:var(--panel2);color:var(--mut);font-size:20px;line-height:1;cursor:pointer}
.gloss{margin-top:6px}
.gloss .gc{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--acc);margin:16px 0 7px}
.gloss button{display:block;width:100%;text-align:left;min-height:42px;padding:10px 12px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--tx);font-size:13px;cursor:pointer}
.gloss button:hover{border-color:var(--acc)}
.gloss button span{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.5}
.legendrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 2px 0;
  font-size:11.5px;color:var(--mut)}
.legendrow .badge{margin-left:0}

/* ---- 起動アニメーション ---- */
#splash{position:fixed;inset:0;background:#0a0a0a;z-index:9999;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#splash.done{opacity:0;pointer-events:none;transition:opacity .38s ease}
#splash svg{width:96px;height:96px;animation:spZoom 1.15s cubic-bezier(.22,.9,.3,1) forwards}
#splash .spname{font-family:var(--min);font-size:19px;letter-spacing:.42em;color:var(--tx);
  opacity:0;animation:spFade .5s ease .42s forwards}
#splash .spsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--dim);
  opacity:0;animation:spFade .5s ease .58s forwards}
@keyframes spZoom{
  0%{transform:scale(.34);opacity:0}
  42%{transform:scale(1.06);opacity:1}
  70%{transform:scale(1)}
  100%{transform:scale(7.2);opacity:0}}
@keyframes spFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #splash svg{animation:none}
  #splash{animation:spFade .2s ease forwards}}
/* ---- 用途スコープバー ---- */
.scopehit{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto;white-space:nowrap}
.scopebar{display:flex;align-items:center;gap:10px;padding:9px 14px 10px;max-width:var(--mw);margin:0 auto;border-top:1px solid var(--line)}
.scopelab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);flex:0 0 auto}
.scopebar .seg{margin-top:0;min-height:0}
.scopebar .seg button{padding:6px 16px;font-size:12px}
/* ---- 凡例 ---- */
.lgnd2{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.lgi{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgi i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.cdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.lgi b{color:var(--tx);font-weight:500;margin-left:2px}
/* ---- strategy ---- */
.stpos{font-family:var(--min);font-size:17px;font-weight:700;line-height:1.4;margin-top:14px}
.stax{color:var(--acc);font-size:12.5px;margin-top:6px;line-height:1.7}
.stblk{margin-top:14px;padding:12px 13px;background:var(--panel2);border-left:2px solid var(--line2)}
.stblk.r{border-left-color:var(--bad)}
.stblk .t{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--dim);margin-bottom:6px}
.stblk p{font-size:12.5px;color:var(--mut);line-height:1.9}
.stnum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}
.stnum div{background:var(--panel);padding:10px 11px}
.stnum .k{font-size:9.5px;color:var(--dim);line-height:1.4}
.stnum .v{font-family:var(--mono);font-size:15px;margin-top:3px}
@media(min-width:620px){.stnum{grid-template-columns:repeat(4,1fr)}}
/* ---- valuation selector ---- */
.vpick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.vpick .sel.full{grid-column:1/-1}
.vpick .sel select{height:48px;padding:16px 26px 2px 9px}
.vdiff{font-family:var(--mono);font-size:10.5px;text-align:right;white-space:nowrap}
.vdiff.u{color:var(--good)}.vdiff.d{color:var(--bad)}.vdiff.z{color:var(--dim)}
.lgnd{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:10px}
.lgnd i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:5px;vertical-align:3px}
/* ---- list ---- */
.plist{border-top:1px solid var(--line);margin-top:12px}
.prow{display:grid;grid-template-columns:1fr 66px 56px;gap:8px;padding:11px 3px;border-bottom:1px solid var(--line);
  cursor:pointer;align-items:center;min-width:0}
.prow:hover,.prow:focus-visible{background:var(--panel2)}
.prow>div:first-child{min-width:0}
.prow .nm{font-size:13px;overflow-wrap:anywhere;line-height:1.4;overflow:hidden;text-overflow:ellipsis}
.prow .mt{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.prow .val{font-family:var(--mono);font-size:15px;text-align:right;white-space:nowrap}
.prow .val small{font-size:8.5px;color:var(--dim);display:block;letter-spacing:.04em}
.badge{display:inline-block;font-family:var(--mono);font-size:8.5px;padding:1px 4px;border-radius:3px;margin-left:4px;
  border:1px solid var(--acc);color:var(--acc);vertical-align:1px}
.badge.ev{border-color:var(--good);color:var(--good)}
.more{width:100%;min-height:46px;margin-top:14px;border:1px solid var(--line2);background:transparent;color:var(--mut);
  font-family:var(--mono);font-size:12px;cursor:pointer;border-radius:9px}
.more:hover{border-color:var(--acc);color:var(--acc)}
.empty{padding:32px 8px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8}
.empty b{display:block;color:var(--mut);font-size:14px;margin-bottom:8px}

/* ---- playbook ---- */
.play{background:var(--panel);border:1px solid var(--line);padding:18px 14px;margin-top:14px;position:relative;overflow:hidden}
.play::before{content:attr(data-n);position:absolute;right:9px;top:0;font-family:var(--mono);font-size:34px;
  color:rgba(200,163,95,.1)}
.play .role{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--acc)}
.play h3{font-family:var(--min);font-size:16px;font-weight:700;margin:7px 0 6px;line-height:1.45}
.play p{font-size:12.4px;color:var(--mut)}
.play .ev{margin-top:11px;padding:10px 11px;background:var(--panel2);border-left:2px solid var(--acc);
  font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--mut)}
.play .ev b{color:var(--acc);font-weight:500}

footer{padding:26px 12px 34px;color:var(--dim);font-size:10.5px;line-height:1.8;border-top:1px solid var(--line);margin-top:22px}

/* ---- bottom nav ---- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(12,13,15,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;min-width:0;height:var(--bnav);border:0;background:transparent;color:var(--dim);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-top:2px solid transparent;padding:0 2px}
.bnav .j{font-size:12.5px;letter-spacing:.04em}
.bnav .e{font-family:var(--mono);font-size:8px;letter-spacing:.1em}
.bnav button.on{color:var(--acc);border-top-color:var(--acc);background:rgba(200,163,95,.06)}

.brand .mark{width:20px;height:20px;flex:0 0 auto;display:block}
@media(min-width:900px){.brand .mark{width:23px;height:23px}}
.mtip{position:fixed;z-index:90;background:#16171b;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
  font-size:11px;line-height:1.6;color:var(--mut);pointer-events:none;opacity:0;transition:opacity .12s;
  max-width:min(260px,86vw);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.mtip.on{opacity:1}
.mtip b{color:var(--tx);font-weight:500;display:block;margin-bottom:3px}
#errbar{display:none;position:fixed;left:0;right:0;bottom:calc(var(--bnav) + env(safe-area-inset-bottom));z-index:95;
  background:#2a1416;border-top:1px solid #7a3b3f;color:#e0a8a8;font-family:var(--mono);font-size:11px;
  padding:9px 13px;line-height:1.6}

/* ============ tablet ============ */
@media(min-width:620px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .selects{grid-template-columns:repeat(3,1fr)}
  .cw{height:280px}.cw.tall{height:320px}.cw.radar{height:300px}
  .prow{grid-template-columns:1fr 92px 78px;padding:12px 5px}
  .prow .nm{font-size:13.5px}.prow .val{font-size:17px}
  h1.big{font-size:30px}
  .bar{grid-template-columns:80px 1fr 46px}
}
/* ============ desktop ============ */
@media(min-width:900px){
  :root{--bnav:0px}
  body{padding-bottom:0}
  .bnav{display:none}
  #errbar{bottom:0}
  main{padding:0 24px}
  .top .row{padding:10px 24px;gap:16px}
  .brand{font-size:17px;letter-spacing:.14em}
  .brand small{font-size:9px;letter-spacing:.24em}
  .viewtabs{display:flex;gap:3px;flex:0 0 auto}
  .viewtabs button{height:38px;padding:0 15px;border:0;border-bottom:2px solid transparent;background:transparent;
    color:var(--mut);font-size:13.5px;cursor:pointer}
  .viewtabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
  .search{max-width:340px;flex:1 1 240px}
  .selects{padding:0 24px 12px;grid-template-columns:repeat(5,1fr)}
  .hits{padding:0 26px 9px;font-size:11px}
  .view{padding:26px 0 40px}
  .vtitle{margin-bottom:18px}
  h1.big{font-size:34px}
  .lead{font-size:13.5px}
  .hero{padding:14px 0 30px;margin-bottom:26px}
  .hero .kanji{font-size:92px}.hero .desc{font-size:13.5px}
  #spectrum{height:280px}
  .card{padding:20px 20px 16px}
  .cw{height:310px}.cw.tall{height:360px}.cw.radar{height:340px}
  /* 横並びのカードは高さを揃える。align-items:start だと中身の量で高さがばらつき、
     下端が不揃いになるため stretch にし、カード内部を縦フレックスで組む。 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
  .grid2>.card,.grid3>.card{margin-top:0;display:flex;flex-direction:column}
  /* 注記は下端に寄せ、グラフ位置を揃える */
  .grid2>.card>.note:last-child,.grid3>.card>.note:last-child{margin-top:auto;padding-top:10px}
  .gwrap{margin-top:16px}
  .vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start;margin-top:16px}
  .plays{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .plays>.play{margin-top:0}
  .playwrap{margin-top:16px}
  .kpi{padding:18px 16px}.kpi .v{font-size:26px}.kpi .k{font-size:11px}
  .subtabs button{flex:0 0 auto;min-width:120px}
  .kpitab{font-size:13px}.kpitab td{padding:10px 6px}
  .verdict{padding:18px 18px}.verdict p{font-size:13px}
}
@media(min-width:1100px){
  .vname{font-size:24px}
  .vscore .n{font-size:44px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

    <nav class="viewtabs" id="vtabs"></nav>
